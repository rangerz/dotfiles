[core]
    # fsmonitor: watch file system events to speed up status/diff
    # Enable fsmonitor: watch filesystem events to avoid full-tree scans
    fsmonitor = true

    # fscache: cache file metadata on macOS/Windows to cut system calls
    # Enable fscache: cache file metadata on macOS/Windows to reduce syscalls
    fscache = true

    # Speed up commands involving untracked files such as `git status`.
    # https://git-scm.com/docs/git-update-index#_untracked_cache
    untrackedCache = true

[index]
    # Multithreaded index (0 = detect available CPU threads)
    # Multithreaded index handling (0 = auto-detect available CPU threads)
    threads = 0

[pack]
    # Sparse mode when packing, to use less memory
    # Use sparse mode for packfile compression to save memory
    useSparse = true

    # Multithreaded packfile compression (0 = detect threads)
    # Multithreaded packfile compression (0 = auto-detect threads)
    threads = 0

[repack]
    # Write bitmap indexes on git repack
    # Write bitmap index when repacking to speed up operations
    writeBitmaps = true

[fetch]
    # Skipping algorithm for faster fetch negotiation (skips some common-history checks)
    # Use 'skipping' algorithm to speed up negotiation (skip some history checks)
    negotiationAlgorithm = skipping

    # Prune deleted remote branches on fetch
    # Prune deleted remote branches on fetch
    prune = true

    # Prune tags deleted on the remote too
    # Prune deleted remote tags on fetch
    pruneTags = true

    # Update the commit-graph after fetch to speed up later commands
    # Automatically update commit-graph after fetch to speed up later operations
    writeCommitGraph = true

    # Fetch from all remotes by default, not only origin
    # Fetch from all remotes by default, not just origin
    all = true

[gc]
    # Disable auto gc for speed; run `git gc` by hand to reclaim space
    # Disable automatic garbage collection for speed; run `git gc` manually when needed
    auto = 0

    # Write the commit-graph automatically to speed up log/diff/merge
    # Write commit-graph to speed up log/diff/merge operations
    writeCommitGraph = true