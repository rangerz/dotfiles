[pull]
    # Rebase instead of merge on git pull for a cleaner history
    # Use rebase instead of merge for git pull to keep history cleaner
    rebase = true

[rebase]
    # Auto-stash uncommitted changes before a rebase
    # Auto stash local changes before rebase to avoid conflicts
    autoStash = true

    # Update other refs (branches, tags...) that point at rebased commits
    # Update other refs (branches, tags) pointing to old commits during rebase
    updateRefs = true

    # Keep merge commits when rebasing so the merge history is not lost
    # Preserve merge commits during rebase instead of flattening them
    rebaseMerges = true

[merge]
    # Allow only fast-forward merges, no extra merge commits
    # Only allow fast-forward merges to avoid extra merge commits
    ff = only

    # Renormalize line endings/filters before merging to reduce cross-platform conflicts
    # Allow renormalization before merge; helps cross-platform line endings
    renormalize = true

    # Include a summary of merged commits in merge commit messages
    # Include summaries of merged commits in the merge commit message
    log = true

[push]
    # Set the upstream tracking branch automatically on first push
    # Automatically set upstream (remote tracking) branch on first push
    autoSetupRemote = true

    # Push only the current branch to its upstream
    # Default push behavior: push current branch to its upstream branch
    default = simple

    # Push annotated tags that point at pushed commits
    # Automatically push relevant annotated tags along with commits
    followTags = true

[submodule]
    # Recurse into submodules for git commands (e.g. clone, update)
    # Automatically recurse into submodules for clone/update
    recurse = true

[rerere]
    # Enable rerere: record conflict resolutions and reuse them
    # Enable "reuse recorded resolution" to remember conflict resolutions
    enabled = true

    # Stage a recorded resolution automatically when the same conflict comes back
    # Automatically apply previous resolutions when the same conflict appears
    autoupdate = true
