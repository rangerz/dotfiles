[core]
    editor = vim

    # Custom ignore/attributes paths
    excludesfile = ~/.dotfiles/git/gitignore
    attributesfile = ~/.dotfiles/git/gitattributes

    # Treat spaces before tabs and all kinds of trailing whitespace as an error.
    # [default] trailing-space: looks for spaces at the end of a line
    # [default] space-before-tab: looks for spaces before tabs at the beginning of a line
    whitespace = space-before-tab,-indent-with-non-tab,trailing-space

    # Make `git rebase` safer on macOS.
    # More info: <http://www.git-tower.com/blog/make-git-rebase-safe-on-osx/>
    trustctime = false

    # Prevent showing files whose names contain non-ASCII symbols as unversioned.
    # http://michael-kuehnel.de/git/2014/11/21/git-mac-osx-and-german-umlaute.html
    precomposeunicode = false

    # Handle line endings when committing/checking out files.
    autocrlf = input

    # Ensure safety with line endings.
    safecrlf = true

    # Display paths with non-ASCII chars (ex: UTF-8 chinese) in readable form.
    quotepath = false

[init]
    defaultBranch = main

[commit]
    template = ~/.dotfiles/git/commit.template
    verbose = true
    cleanup = scissors

[branch]
    # Show most recently changed branches first.
    sort = -committerdate

[tag]
    sort = version:refname

[apply]
    # Detect whitespace errors when applying a patch.
    whitespace = fix

[diff]
    # Detect renames and copies; with colorMoved this shows moved lines more accurately
    # Detect both renames and copies; improves moved-line/colorMoved rendering
    renames = copies

    # Raise the rename/copy detection file limit (default 200); helps large repos
    # Increase limit for rename/copy detection (default 200, set to 1000 here)
    renameLimit = 1000

    # More compact diffs: merge nearby changes into one hunk for easier reading
    # Enable more compact diffs by grouping adjacent changes, improves readability
    compactionHeuristic = true

    # Ignore whitespace when detecting moved lines, so indent-only changes still count as moves
    # Ignore whitespace when detecting moved lines; prevents false positives from indentation/spacing changes
    colorMovedWS = no

    # Better hunk boundary detection
    # Better hunk boundaries for readable diffs
    algorithm = histogram

    # Show submodule commit logs, not just hashes
    # Show submodule commit logs instead of only commit hashes
    submodule = log

    # Use meaningful file prefixes in diff output
    # Use more descriptive prefixes in diff output (e.g., i/ for index, w/ for working tree)
    mnemonicPrefix = true

[log]
    # git log date format: 2024-12-04 20:04:29 -0600.
    date = iso

    decorate = short

[status]
    # Show a submodule summary in git status (commits and changes)
    # Show submodule summary in git status output
    submoduleSummary = true

[advice]
    statusHints = false

[help]
    # Mild autocorrect: suggest and ask
    # Mild autocorrect: prompt before running a fix
    autocorrect = prompt

[url "ssh://git@github.com/"]
    # Rewrite https to ssh only for push; fetch stays on https so a new machine can update public repos before its key is on GitHub
    # Rewrite https to ssh for push only; fetch stays on https, so public repos
    # still update on a new machine before its key is added to GitHub
    pushInsteadOf = https://github.com/

[credential "https://github.com"]
    # Use the gh login to supply a token for https fetches of private repos
    # Let gh supply the token for https fetches of private repos
    helper = !gh auth git-credential
