[alias]
    dfv = "!f() { git difftool -y -x 'code --wait --diff \"$LOCAL\" \"$REMOTE\"' -- \"$@\"; }; f"

[diff]
    tool = vscode

[difftool "vscode"]
    cmd = code --wait --diff "$LOCAL" "$REMOTE"

[difftool]
    prompt = false

[merge]
    tool = vscode

[mergetool]
    prompt = false

    # Do not keep *.orig backups after a merge
    # Do not keep *.orig backups after merge
    keepBackup = false

    # Merge in a temp file to avoid overwriting directly (more reliable across platforms)
    # Write merge results to a temp file first; safer on some platforms/symlinks
    writeToTemp = true

[mergetool "vscode"]
    trustExitCode = true
    cmd = code --wait --merge "$REMOTE" "$LOCAL" "$BASE" "$MERGED"
