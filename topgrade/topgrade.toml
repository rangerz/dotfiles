# Linked to ~/.config/topgrade.d/dotfiles.toml by topgrade/install.sh
[misc]
pre_sudo = true
assume_yes = true
no_retry = true
disable = ["containers", "pip3"]
no_self_update = true

[brew]
greedy_cask = true
greedy_latest = true
autoremove = true

[git]
max_concurrency = 4
repos = [
  "~/.dotfiles"
]
pull_predefined = false

[commands]
# agy cannot update plugins itself; re-copy them from Claude (keeps plugins disabled in agy disabled)
"Antigravity CLI Plugins" = "if command -v agy >/dev/null 2>&1; then agy plugin import claude --force </dev/null; fi"
